services:
  app:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/scanning/app:latest
    build:
      context: .
    ports:
      - "8081:8081"
    privileged: false
    user: app
    read_only: true
    environment:
      - SIRIUS_BASE_URL=http://sirius-mock:8080
      - AWS_ENDPOINT=http://ministack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SECRETS_MANAGER_PREFIX=local/
      - ENVIRONMENT=local
      - DOCUMENTS_TABLE=Documents
    healthcheck:
      test: wget -O /dev/null -S 'http://localhost:8081/health-check' 2>&1 | grep 'HTTP/1.1 200 OK' || exit 1
      interval: 5s
      timeout: 2s
      retries: 5
    depends_on:
      ministack:
        condition: service_healthy
      sirius-mock:
        condition: service_healthy

  app-test:
    build:
      context: .
      dockerfile: test.Dockerfile
    environment:
      - SIRIUS_BASE_URL=http://sirius-mock:8080
      - XSD_PATH=/app/xsd
      - AWS_ENDPOINT=http://ministack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SECRETS_MANAGER_PREFIX=local/
      - ENVIRONMENT=local
      - DOCUMENTS_TABLE=Documents
    volumes:
      - .:/app
      - ./test-results:/tmp/test-results
    working_dir: /app
    command: go test -short ./... -covermode=atomic -coverprofile=/tmp/test-results/coverage.out
    depends_on:
      ministack:
        condition: service_healthy

  pact-cli:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/shared/opg-pact-cli:latest
    volumes:
      - ./internal/sirius/pacts:/tmp/pacts

  ministack:
    image: ministackorg/ministack:1.5.37@sha256:cdfa6ba04f4c7febd9e14a34a21e31b9f0fb5279ee6af545784c05219f5a59a4
    volumes:
      - "./scripts/ministack/init:/docker-entrypoint-initaws.d/ready.d"
      - "./scripts/ministack/wait:/scripts/wait"
    environment:
      AWS_DEFAULT_REGION: eu-west-1
      SERVICES: "dynamodb,s3,secretsmanager,sqs,ssm"
      LOG_LEVEL: DEBUG
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "bash", "/scripts/wait/healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  sirius-mock:
    image: outofcoffee/imposter:4.9.3@sha256:ff25c8708944ec81a1992cd33433bbd032f12d64ded32ec1e6825810a5f2d5cb
    volumes:
      - ./docker/sirius:/opt/imposter/config
    healthcheck:
      test: ["CMD", "imposter", "list", "-x"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  go-lint:
    build: docker/go-lint
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint/v1.64.5:/root/.cache
    command: golangci-lint run -v --timeout 5m --output.text.path stdout --output.sarif.path /go/src/app/test-results/go-lint.sarif --modules-download-mode=readonly

  gosec:
    image: securego/gosec:2.24.6@sha256:2cf71ea78210c496c65e3a987576a9c8317b68e20f2960520b3f6f8f9f539be5
    working_dir: /app
    environment:
      GOTOOLCHAIN: auto
    volumes:
      - .:/app
    command: -exclude-dir=.gocache -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...
